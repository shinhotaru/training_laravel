version: '3'
services:
  php:
    container_name: php-training-laravel1
    build:
      context: "./"
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - .:/var/www
    depends_on:
      - mysql

  nginx:
    container_name: nginx-training-laravel1
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    depends_on:
      - php

  mysql:
    container_name: mysql-training-laravel1
    platform: linux/x86_64
    build:
      context: "./"
      dockerfile: ./docker/mysql/Dockerfile
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=training_laravel
      - MYSQL_USER=training
      - MYSQL_PASSWORD=secret

  swagger-ui:
    container_name: swagger-training-laravel1
    image: swaggerapi/swagger-ui
    ports:
      - 10800:8080
    environment:
      API_URL: http://localhost:8080/swagger/
      API_HOST_URL: http://localhost:8080/

volumes:
  mysql-data:
    driver: local
